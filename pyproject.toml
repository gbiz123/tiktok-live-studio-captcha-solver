# [build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"  # If not defined, then legacy behavior can happen.

[project]
name = "tiktok-live-studio-captcha-solver"
version = "0.0.8"

description = "This package solves TikTok Live Studio captcha in one line of code."
readme = "README.md"
requires-python = ">=3.10"

keywords = ["tiktok", "captcha", "solver", "selenium", "rotate", "puzzle", "3d"]

authors = [
  {name = "Toughdata LLC", email = "greg@toughdata.net" }
]

[tool.setuptools.package-data]
"*" = ["*.png"]

classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "pyautogui",
  "opencv-python",
  "pillow",
  "numpy",
  "pytest",
  "requests",
  "pydantic"
]

[project.urls]
"Homepage" = "https://www.sadcaptcha.com"
"Source" = "https://github.com/gbiz123/tiktok-captcha-solver/"
